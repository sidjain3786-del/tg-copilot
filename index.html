<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trader Co-Pilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-screen" class="center-screen">Loading...</div>

  <div id="auth-screen" class="center-screen" style="display:none;">
    <div class="auth-card">
      <div class="auth-logo">🧠</div>
      <h1 class="auth-title">TRADER CO-PILOT</h1>
      <p id="auth-subtitle" class="auth-subtitle">Apne account mein login karo</p>

      <form id="auth-form">
        <div id="auth-name-field" class="field" style="display:none;">
          <label>Naam</label>
          <input type="text" id="auth-name" autocomplete="name">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="auth-email" required autocomplete="email">
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="auth-password" required minlength="6" autocomplete="current-password">
        </div>
        <p id="auth-error" class="auth-error" style="display:none;"></p>
        <button type="submit" id="auth-submit" class="btn-primary btn-block">Login</button>
      </form>

      <p class="auth-toggle">
        <span id="auth-toggle-text">Account nahi hai?</span>
        <button id="auth-toggle-btn" type="button">Sign Up</button>
      </p>
    </div>
  </div>

  <div id="app-screen" style="display:none;">
    <header class="app-header">
      <div class="header-inner">
        <div class="header-brand">
          <div class="brand-icon">🧠</div>
          <div>
            <h1 class="brand-title">TRADER <span class="brand-badge">CO-PILOT</span></h1>
            <p class="brand-sub">GAMIFIED JOURNAL &amp; MINDSET ENGINE</p>
          </div>
        </div>
        <div class="header-stats">
          <div class="stat-pill">
            <span>🏆</span><span id="stat-level" class="mono">Lvl 1</span>
          </div>
          <div class="stat-pill">
            <span>🛡️</span><span id="stat-discipline" class="mono">0% Rules</span>
          </div>
          <div class="user-block">
            <span id="user-name" class="user-name"></span>
            <button id="logout-btn" class="btn-logout">Logout</button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <nav id="tab-nav" class="tab-nav"></nav>
      <div id="tab-content"></div>
    </main>
  </div>

  <div id="image-modal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <span>🖼️ Chart Screenshot Inspection</span>
        <button id="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <img id="modal-image" src="" alt="Chart">
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
